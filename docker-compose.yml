services:
  mtproto-proxy:
    build:
      context: .
      args:
        MTPROTO_REPO_URL: ${MTPROTO_REPO_URL}
    container_name: mtproto-proxy
    volumes:
      - ./volumes/config:/data
    restart: unless-stopped
    ports:
      - 8443:8889/udp
      - 8443:8889/tcp
    env_file:
      - stack.env
